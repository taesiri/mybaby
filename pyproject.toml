[project]
name = "mybaby"
version = "0.1.0"
description = "Starter Flask app managed with uv and ruff."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flask",
  "python-dotenv",
  "google-genai",
]

[project.optional-dependencies]
dev = [
  "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
